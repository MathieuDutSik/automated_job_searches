# Rules for `ajs filter`. Each open job is checked in this order and the
# first rule it fails becomes its exclusion reason:
#
#   1. title   — must match a `keep` pattern and no `exclude` pattern
#   2. remote  — must be remote, and not hybrid or on-site
#   3. region  — location must be open-to-all, Europe-wide or EMEA, not
#                a single country or a region outside Europe
#   4. salary  — when a salary is stated, its top must reach `min_usd`
#
# Patterns are regexes matched case-insensitively at word boundaries,
# except all-caps terms of up to 5 letters in the region lists (US, USA,
# UK, EU, LATAM, APAC, EMEA, ...), which match case-sensitively so `US`
# doesn't hit the word "us". Avoid terms that are part of other place
# names ("wales" is in "New South Wales", "england" in "New England").
# Edit this file and the next crawl/sync/filter re-checks every open job.

[title]
# Roles you want: software engineering, research / maths.
keep = [
    'engineer', 'engineering', 'developer', 'programmer', 'software', 'swe',
    'backend', 'back-end', 'full[- ]?stack', 'systems', 'architect',
    'compilers?', 'c\+\+', 'rust', 'zig', 'haskell', 'ocaml', 'julia',
    'research', 'researcher', 'scientist', 'mathematician', 'mathematics',
    'algorithms?', 'cryptograph\w*', 'hpc', 'scientific', 'numerical',
    'computational', 'formal verification', 'quant(itative)? (researcher|developer)',
]
# Quantitative and optimisation roles: kept on title even when an
# `exclude` word (analyst, lead, manager, ...) is present or no `keep`
# pattern matches. Remote / region / salary rules still apply.
always_keep = [
    'quantitative (analyst|researcher|developer|engineer|trader|modell?er)',
    'quant (analyst|researcher|developer|engineer|trader)',
    'operations research',
    'optimi[sz]ation (engineer|scientist|researcher|developer)',
    '(mathematical|numerical|combinatorial|convex|discrete|stochastic) optimi[sz]ation',
    'algorithms? researcher', 'mathematical modell?er', 'solver (engineer|developer)',
]
# Checked first: any match excludes, even if a keep pattern matches too.
exclude = [
    'manager', 'management', 'director', 'head of', 'vp', 'vice president',
    'chief', 'president', 'founder',
    'sales', 'account executive', 'account manager', 'business development',
    'marketing', 'growth', 'seo', 'sem', 'ppc', 'copywriter', 'content',
    'community', 'social media', 'recruiter', 'recruiting', 'talent', 'hr',
    'people partner', 'customer success', 'customer support', 'support',
    'solutions? (engineer|architect|consultant)', 'sales engineer',
    'pre-?sales', 'implementation', 'onboarding',
    'designer', 'design', 'ux', 'ui',
    'devops', 'sre', 'site reliability', 'it support', 'helpdesk',
    'data engineer', 'data analyst', 'data scientist', 'analyst',
    'machine learning engineer', 'ml engineer', 'ml ops', 'mlops',
    'qa', 'quality assurance', 'test engineer', 'tester', 'sdet',
    'network engineer', 'field', 'hardware', 'mechanical', 'electrical',
    'civil', 'structural', 'process engineer', 'manufacturing',
    'intern', 'internship', 'working student', 'apprentice', 'trainee',
    'product owner', 'scrum master', 'project', 'program',
    'business operations', 'revenue operations', 'revops', 'sales operations',
    'consultant', 'accountant', 'legal', 'counsel', 'paralegal',
    'teacher', 'tutor', 'translator', 'assistant', 'representative',
    'nurse', 'physician', 'clinical',
    'subject matter expert', 'ai trainer', 'ai training', 'annotator',
    'evaluator', 'analytics engineer',
    'advocate', 'developer relations', 'devrel',
]

[remote]
# A job with no remote flag counts as remote when its location or title
# contains one of these.
unknown_ok_if = ['remote', 'anywhere', 'worldwide', 'work from home', 'telecommute']
# A location or title with one of these is hybrid: excluded.
hybrid_location = ['hybrid']
# On-site markers: excluded unless the location also says remote
# ("Remote/Onsite" is fine).
onsite_location = ['on-?site', 'in[- ]office', 'office[- ]based']
# Description phrases that make a remote-flagged job hybrid or on-site.
hybrid_description = [
    # Phrasings that state a requirement. A bare "hybrid work" also shows
    # up in "choose between remote, office or hybrid work", so it's not
    # enough on its own.
    'we\s+(embrace|operate|follow|work|have)\s+(on\s+|in\s+)?a\s+hybrid',
    'hybrid\s+(policy|schedule)',
    'this\s+is\s+an?\s+(hybrid|on-?site|office[- ]based|in[- ]office)\s+(role|position|job)\s*(,|\.|based|located|in\b|out\s+of|reporting|requiring)',
    '(this|the)\s+(role|position|job)\s+is\s+(a\s+)?(hybrid|on-?site|office[- ]based|in[- ]office)\s*(role|position)?\s*(,|\.|based|located|in\b|out\s+of|reporting|requiring|with\s+\d)',
    '\b(\d|one|two|three|four|five)\s+days?\s+(a|per|each)\s+week\s+(in|at|from)\s+(the|our)\s+(office|hq|headquarters)',
    '(in|from)\s+(the|our)\s+office\s+(\d|one|two|three|four|five)\s+days',
    'working\s+from\s+(the|our)\s+office\s+(monday|tuesday|wednesday|thursday|friday)',
    'expect(ed)?\s+(all\s+)?(staff|employees|you|everyone)\s+to\s+be\s+in\s+(one\s+of\s+)?(the|our)\s+offices?',
]

[region]
# Locations that are fine for you: multi-country regions and open-to-all.
# A location naming one of these passes the region check.
allow = [
    'worldwide', 'anywhere', 'global', 'globally', 'international',
    'europe', 'european', 'EMEA', 'EU', 'EEA', 'CET', 'CEST',
]
# Single European countries and cities. A remote job tied to one of them
